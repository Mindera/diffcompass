name: Sync Minders team

on:
  schedule:
    - cron: "17 2 * * *" # Every night at 02:17 UTC.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report missing members without adding them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mindera-minders-team-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Mindera/diffcompass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Add missing organization members
        env:
          GH_TOKEN: ${{ secrets.MINDERS_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure the MINDERS_SYNC_TOKEN repository secret with a Minders team-maintainer credential."
            exit 1
          fi
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          bun scripts/sync-minders.ts "${args[@]}"
