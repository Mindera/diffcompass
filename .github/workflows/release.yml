name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - shell: powershell
        run: ./scripts/build-windows-release.ps1
      - shell: powershell
        run: ./scripts/smoke-install.ps1
  release:
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
      - run: bun run verify
      - run: bun run build:release
      - run: ./scripts/smoke-install.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/checksums.txt
