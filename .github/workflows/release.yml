name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - shell: powershell
        run: ./scripts/build-windows-release.ps1
      - shell: powershell
        run: ./scripts/smoke-install.ps1
  release:
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
      - run: bun run verify
      - run: bun run build:release
      - run: ./scripts/smoke-install.sh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/install.sh
            dist/release/install.ps1
            dist/release/checksums.txt
