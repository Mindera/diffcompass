name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build:release
      - run: ./scripts/smoke-install.sh
  monaco:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [local, navigation, discussions, before]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:monaco
        env:
          MONACO_CHECK_GROUP: ${{ matrix.group }}
      - if: matrix.group == 'local'
        run: bun run test:github-suggestions-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: monaco-browser-failure-${{ matrix.group }}
          path: |
            /tmp/dc-*.png
            /tmp/diffcompass-suggestions-*.png
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - shell: powershell
        run: ./scripts/build-windows-release.ps1
      - shell: powershell
        run: ./scripts/smoke-install.ps1
  # Preserve the existing required check: it must include every browser shard
  # as well as both release builds, even when an upstream job fails or cancels.
  verify:
    if: always()
    needs: [foundation, monaco, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          FOUNDATION: ${{ needs.foundation.result }}
          MONACO: ${{ needs.monaco.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$FOUNDATION" = success
          test "$MONACO" = success
          test "$WINDOWS" = success
