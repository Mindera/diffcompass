name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build:release
      - run: ./scripts/smoke-install.sh
  monaco:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [local, navigation, discussions, before]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:monaco
        env:
          MONACO_CHECK_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monaco-browser-failure-${{ matrix.group }}
          path: /tmp/dc-*.png
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - shell: powershell
        run: ./scripts/build-windows-release.ps1
      - shell: powershell
        run: ./scripts/smoke-install.ps1
  # Preserve the existing required check: it must include every browser shard
  # as well as both release builds, even when an upstream job fails or cancels.
  verify:
    if: always()
    needs: [foundation, monaco, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          FOUNDATION: ${{ needs.foundation.result }}
          MONACO: ${{ needs.monaco.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$FOUNDATION" = success
          test "$MONACO" = success
          test "$WINDOWS" = success
