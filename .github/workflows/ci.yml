name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether browser tests are needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Skip only documentation-only changes. Unknown bases or diff errors
          # keep browser coverage enabled, as do application, test and CI edits.
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] &&
             git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)*.md' ':(exclude)docs/**'; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: browser tests are not needed."
          else
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "Running browser tests for this change."
          fi
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build:release
      - run: ./scripts/smoke-install.sh
  monaco:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [briefing, local, navigation, discussions, before]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - if: matrix.group == 'briefing'
        run: |
          bun scripts/package-archify.ts "$RUNNER_TEMP/briefing-archify"
          echo "DIFFCOMPASS_ARCHIFY_DIR=$RUNNER_TEMP/briefing-archify" >> "$GITHUB_ENV"
      - run: bun run test:monaco
        env:
          MONACO_CHECK_GROUP: ${{ matrix.group }}
      - if: matrix.group == 'local'
        run: bun run test:github-suggestions-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: monaco-browser-failure-${{ matrix.group }}
          path: |
            /tmp/dc-*.png
            /tmp/diffcompass-suggestions-*.png
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - shell: powershell
        run: ./scripts/build-windows-release.ps1
      - shell: powershell
        run: ./scripts/smoke-install.ps1
  # Keep one required check. Browser skips are valid only for a confirmed
  # documentation-only change; failures and cancellations must still fail CI.
  verify:
    if: always()
    needs: [changes, foundation, monaco, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          FOUNDATION: ${{ needs.foundation.result }}
          MONACO: ${{ needs.monaco.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$CHANGES" = success
          test "$FOUNDATION" = success
          if [[ "$BROWSER_REQUIRED" == true ]]; then
            test "$MONACO" = success
          else
            test "$BROWSER_REQUIRED" = false
            test "$MONACO" = skipped
          fi
          test "$WINDOWS" = success
